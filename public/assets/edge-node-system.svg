<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc"><title id="title">Functional sensor and actuator architecture</title><desc id="desc">Sensors feed an ESP32-S3 local controller; the servo and radio are distinct outputs. A protected input supplies separate RFID, actuator and logic power rails.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dfebdf"/></pattern><linearGradient id="pcb" x2="1" y2="1"><stop stop-color="#28796a"/><stop offset="1" stop-color="#215d52"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#7b9c88" stroke-width="1.3"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1000" height="565" rx="20" fill="#f6f8ef" stroke="none"/><rect width="1000" height="565" fill="url(#grid)"/><text x="35" y="35" font-size="14" fill="#55775f" font-weight="700" text-anchor="start">FUNCTIONAL ARCHITECTURE / PLANNED</text><rect x="35" y="78" width="245" height="82" rx="13" fill="#eaf0df" stroke="#d0ddc4"/><text x="57" y="109" font-size="17" fill="#45684f" font-weight="700" text-anchor="start">Hopper distance</text><text x="57" y="136" font-size="11" fill="#7f9271" font-weight="500" text-anchor="start">UART · headspace estimate</text><polyline points="280,119 360,119 360,232 390,232" fill="none" stroke="#8cb39e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><rect x="35" y="190" width="245" height="82" rx="13" fill="#eaf0df" stroke="#d0ddc4"/><text x="57" y="221" font-size="17" fill="#45684f" font-weight="700" text-anchor="start">Climate + wetness</text><text x="57" y="248" font-size="11" fill="#7f9271" font-weight="500" text-anchor="start">I²C / ADC · temp, RH, local water</text><polyline points="280,231 360,231 360,232 390,232" fill="none" stroke="#8cb39e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><rect x="35" y="302" width="245" height="82" rx="13" fill="#eaf0df" stroke="#d0ddc4"/><text x="57" y="333" font-size="17" fill="#45684f" font-weight="700" text-anchor="start">Animal-chip reader</text><text x="57" y="360" font-size="11" fill="#7f9271" font-weight="500" text-anchor="start">UART · 134.2 kHz FDX-B</text><polyline points="280,343 360,343 360,232 390,232" fill="none" stroke="#8cb39e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><rect x="390" y="117" width="228" height="224" rx="22" fill="#377c6b" stroke="none"/><text x="504" y="162" font-size="26" fill="#f0f3da" font-weight="700" text-anchor="middle">ESP32-S3</text><text x="504" y="196" font-size="13" fill="#cae0bd" font-weight="500" text-anchor="middle">Local policy + event log</text><text x="504" y="227" font-size="12" fill="#cae0bd" font-weight="500" text-anchor="middle">Chip → visit sessions</text><text x="504" y="254" font-size="12" fill="#cae0bd" font-weight="500" text-anchor="middle">Bounded gate requests</text><text x="504" y="281" font-size="12" fill="#cae0bd" font-weight="500" text-anchor="middle">Queue → ACK → replay</text><rect x="720" y="78" width="245" height="82" rx="13" fill="#f7ecd9" stroke="#e6d8bb"/><text x="742" y="109" font-size="16" fill="#6d7454" font-weight="700" text-anchor="start">Food-gate actuator</text><text x="742" y="136" font-size="10" fill="#979171" font-weight="500" text-anchor="start">PWM + enable + feedback</text><polyline points="618,232 675,232 675,119 720,119" fill="none" stroke="#b2b38a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><rect x="720" y="190" width="245" height="82" rx="13" fill="#f7ecd9" stroke="#e6d8bb"/><text x="742" y="221" font-size="16" fill="#6d7454" font-weight="700" text-anchor="start">Wi-Fi / BLE / optional LoRa</text><text x="742" y="248" font-size="10" fill="#979171" font-weight="500" text-anchor="start">Compact event packets → shared hub</text><polyline points="618,232 675,232 675,231 720,231" fill="none" stroke="#b2b38a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><rect x="720" y="302" width="245" height="82" rx="13" fill="#f7ecd9" stroke="#e6d8bb"/><text x="742" y="333" font-size="16" fill="#6d7454" font-weight="700" text-anchor="start">Care team record</text><text x="742" y="360" font-size="10" fill="#979171" font-weight="500" text-anchor="start">People verify identity and delivery</text><polyline points="618,232 675,232 675,343 720,343" fill="none" stroke="#b2b38a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><rect x="115" y="425" width="770" height="77" rx="14" fill="#edf0e1" stroke="#d2ddc3"/><text x="143" y="454" font-size="16" fill="#63825c" font-weight="700" text-anchor="start">12 V protected input</text><text x="143" y="479" font-size="11" fill="#8e9b7c" font-weight="500" text-anchor="start">RFID supply rail</text><text x="440" y="454" font-size="16" fill="#63825c" font-weight="700" text-anchor="start">5 V switched actuator rail</text><text x="440" y="479" font-size="11" fill="#8e9b7c" font-weight="500" text-anchor="start">Current budget + bulk capacitance</text><text x="707" y="454" font-size="16" fill="#63825c" font-weight="700" text-anchor="start">Clean 3.3 V</text><text x="707" y="479" font-size="11" fill="#8e9b7c" font-weight="500" text-anchor="start">Logic + sensors</text><text x="35" y="540" font-size="11" fill="#8a9878" font-weight="500" text-anchor="start">Separate motor and logic regulation, a common return strategy, protected ADC inputs and antenna keep-outs need an actual schematic review.</text></g></svg>