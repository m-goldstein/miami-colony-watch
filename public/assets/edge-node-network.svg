<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="545" viewBox="0 0 1000 545" role="img" aria-labelledby="title desc"><title id="title">Proposed edge-node to shared-hub topology</title><desc id="desc">Three colony nodes transmit compact events to a powered hub, which acknowledges identities and forwards to the care team using existing backhaul. Local logging continues through hub outages.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dfebdf"/></pattern><linearGradient id="pcb" x2="1" y2="1"><stop stop-color="#28796a"/><stop offset="1" stop-color="#215d52"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#7b9c88" stroke-width="1.3"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1000" height="545" rx="20" fill="#f6f8ef" stroke="none"/><rect width="1000" height="545" fill="url(#grid)"/><text x="35" y="35" font-size="14" fill="#577c5f" font-weight="700" text-anchor="start">MANY SMALL NODES / ONE SHARED PICTURE</text><rect x="48" y="75" width="223" height="82" rx="15" fill="#e9f1df" stroke="#c5d9b9"/><text x="73" y="107" font-size="16" fill="#577b53" font-weight="700" text-anchor="start">South Point</text><text x="73" y="134" font-size="10" fill="#8e9f7e" font-weight="500" text-anchor="start">Sense • log • bounded local control</text><polyline points="271,116 377,116 377,238 439,238" fill="none" stroke="#95b39b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><rect x="48" y="196" width="223" height="82" rx="15" fill="#e9f1df" stroke="#c5d9b9"/><text x="73" y="228" font-size="16" fill="#577b53" font-weight="700" text-anchor="start">Banyan Corner</text><text x="73" y="255" font-size="10" fill="#8e9f7e" font-weight="500" text-anchor="start">Sense • log • bounded local control</text><polyline points="271,237 377,237 377,238 439,238" fill="none" stroke="#95b39b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><rect x="48" y="317" width="223" height="82" rx="15" fill="#e9f1df" stroke="#c5d9b9"/><text x="73" y="349" font-size="16" fill="#577b53" font-weight="700" text-anchor="start">Palm Courtyard</text><text x="73" y="376" font-size="10" fill="#8e9f7e" font-weight="500" text-anchor="start">Sense • log • bounded local control</text><polyline points="271,358 377,358 377,238 439,238" fill="none" stroke="#95b39b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6"/><rect x="439" y="155" width="220" height="169" rx="21" fill="#377e6e" stroke="none"/><text x="549" y="199" font-size="20" fill="#e4edcf" font-weight="700" text-anchor="middle">SHARED HUB</text><text x="549" y="229" font-size="12" fill="#c7dcbc" font-weight="500" text-anchor="middle">Receive → ACK → deduplicate</text><text x="549" y="257" font-size="11" fill="#c7dcbc" font-weight="500" text-anchor="middle">Powered + suitable antenna</text><text x="549" y="286" font-size="11" fill="#c7dcbc" font-weight="500" text-anchor="middle">Existing backhaul or local service</text><polyline points="659,238 752,238" fill="none" stroke="#a5ba93" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><rect x="752" y="155" width="208" height="169" rx="20" fill="#f6edd9" stroke="#e4d9ba"/><text x="856" y="201" font-size="20" fill="#7a8057" font-weight="700" text-anchor="middle">CARE TEAM</text><text x="856" y="232" font-size="11" fill="#9c9b7b" font-weight="500" text-anchor="middle">Visits + needs + verified records</text><text x="856" y="260" font-size="11" fill="#9c9b7b" font-weight="500" text-anchor="middle">A radio read stays a sensor event</text><text x="346" y="109" font-size="12" fill="#7e9877" font-weight="600" text-anchor="middle">Wi-Fi / BLE / LoRa</text><text x="549" y="371" font-size="11" fill="#859879" font-weight="500" text-anchor="middle">LoRa design: private point-to-point star, not a LoRaWAN concentrator gateway.</text><rect x="106" y="437" width="787" height="71" rx="13" fill="#eff2e4" stroke="#dbe3cf"/><text x="499" y="465" font-size="13" fill="#6e885e" font-weight="600" text-anchor="middle">When the hub is offline, local event IDs and sequence numbers remain queued.</text><text x="499" y="489" font-size="11" fill="#929e7e" font-weight="500" text-anchor="middle">No cloud-controlled gate dependency. No cellular modem or SIM is included in a node.</text></g></svg>